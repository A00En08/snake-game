<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 25px;
}

#game {
    background: #0b1220;
    border: 3px solid #374151;
    margin-top: 10px;
}

.info {
    font-size: 20px;
    margin: 12px;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🐍 貪吃蛇</h1>

<div class="info">
    分數：<span id="score">0</span>
</div>

<canvas id="game" width="500" height="500"></canvas>

<br><br>

<button onclick="restartGame()">重新開始</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 25;
const size = canvas.width / grid;

let snake;
let food;
let dx;
let dy;
let score;
let gameOver;

function restartGame() {
    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    dx = 1;
    dy = 0;
    score = 0;
    gameOver = false;

    document.getElementById("score").textContent = score;

    createFood();
}

function createFood() {
    food = {
        x: Math.floor(Math.random() * grid),
        y: Math.floor(Math.random() * grid)
    };
}

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowUp" && dy !== 1) {
        dx = 0;
        dy = -1;
    }

    if (e.key === "ArrowDown" && dy !== -1) {
        dx = 0;
        dy = 1;
    }

    if (e.key === "ArrowLeft" && dx !== 1) {
        dx = -1;
        dy = 0;
    }

    if (e.key === "ArrowRight" && dx !== -1) {
        dx = 1;
        dy = 0;
    }
});

function update() {

    if (gameOver) return;

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    if (
        head.x < 0 ||
        head.x >= grid ||
        head.y < 0 ||
        head.y >= grid
    ) {
        endGame();
        return;
    }

    for (let part of snake) {
        if (part.x === head.x && part.y === head.y) {
            endGame();
            return;
        }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById("score").textContent = score;
        createFood();
    } else {
        snake.pop();
    }
}

function draw() {

    ctx.fillStyle = "#0b1220";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ef4444";
    ctx.fillRect(
        food.x * size,
        food.y * size,
        size - 1,
        size - 1
    );

    snake.forEach((part, index) => {

        ctx.fillStyle =
            index === 0 ? "#4ade80" : "#22c55e";

        ctx.fillRect(
            part.x * size,
            part.y * size,
            size - 1,
            size - 1
        );
    });
}

function endGame() {
    gameOver = true;

    setTimeout(() => {
        alert("遊戲結束！你的分數：" + score);
    }, 50);
}

function gameLoop() {
    update();
    draw();
}

restartGame();
setInterval(gameLoop, 100);
</script>

</body>
</html>
